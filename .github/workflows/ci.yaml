name: CI

# Skip changes nothing in the flake can read. Not an allowlist of *.nix:
# Nix code imports SKILL.md, TOML, conf and assets, so those must still run CI.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/README.md"
      - ".claude/**"
      - ".codex/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/README.md"
      - ".claude/**"
      - ".codex/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check

      - name: Validate Lefthook config
        run: nix develop ./dev -c lefthook validate

      - name: Run hooks
        run: nix develop ./dev -c lefthook run pre-commit --all-files

  # `nix flake check` only evaluates darwinConfigurations on Linux, so build
  # failures (e.g. nss-cacert) slip through. Build the system for flake updates.
  darwin-build:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build darwin system
        run: nix build --no-link -L '.#darwinConfigurations."MacBook-V3".system'
